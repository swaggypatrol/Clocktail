# Every push and pull request: the .NET tests (no GPU or driver: the hardware is faked) and the installer's tests, on
# Windows, where Clocktail runs, and on Linux, where releases can be built.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      visual_logs:
        description: Include synthetic previews in logs for environments without artifact downloads
        type: boolean
        default: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: .NET tests
        if: runner.os != 'Windows' || github.event_name != 'pull_request'
        run: dotnet test tests/Clocktail.Tests -c Release -nologo
      - name: Installer tests
        if: runner.os != 'Windows' || github.event_name != 'pull_request'
        # Quoted: node expands the pattern itself (Node 21 on), the same under PowerShell and bash; a directory
        # argument is not searched for tests on every Node version.
        run: node --test "npm/test/*.test.js"
      - name: Test and package Windows PR setup
        id: pr-setup
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          base="$(node -p "require('./npm/package.json').version.split('-')[0].split('+')[0]")"
          commit="$(git rev-parse --short=12 HEAD)"
          version="$base-pr.$PR_NUMBER.g$commit"
          bash build/release.sh "$version"
          echo "package=out/clocktail-$version.tgz" >> "$GITHUB_OUTPUT"
      - name: Windows editor smoke checks and previews (synthetic data, no GPU)
        if: runner.os == 'Windows' && !cancelled()
        timeout-minutes: 3
        run: dotnet run --project tools/Clocktail.UiPreview -c Release -- --output out/ui-preview ${{ inputs.visual_logs && '--emit-previews' || '' }}
      - name: Editor previews
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: curve-editor-preview
          path: out/ui-preview/*.png
          if-no-files-found: warn
      - name: Windows PR setup bundle
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: clocktail-pr-windows-setup
          path: ${{ steps.pr-setup.outputs.package }}
          if-no-files-found: error
